name: Check Epic Free Games

on:
  workflow_dispatch:
  schedule:
    # I cron di GitHub Actions usano UTC.
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: epic-free-games-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: poller/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r poller/requirements.txt

      - name: Run tracker
        run: python -m poller.main

      - name: Commit updated data
        shell: bash
        run: |
          git add state.json docs/games.json docs/history.json docs/assets/covers

          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Epic free games data"
          git push