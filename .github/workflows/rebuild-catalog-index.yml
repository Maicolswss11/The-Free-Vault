name: LEGACY Rebuild Catalog Index

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type REBUILD to run the legacy full rebuild'
        required: true
        default: 'DO_NOT_RUN'

permissions:
  contents: read

concurrency:
  group: catalog-database-sync
  cancel-in-progress: false

jobs:
  rebuild-index:
    if: ${{ inputs.confirmation == 'REBUILD' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: poller/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r poller/requirements.txt

      - name: Verify Supabase secrets
        shell: bash
        run: |
          test -n "$SUPABASE_URL" || (echo "Manca SUPABASE_URL" && exit 1)
          test -n "$SUPABASE_SECRET_KEY" || (echo "Manca SUPABASE_SECRET_KEY" && exit 1)

      - name: Rebuild canonical catalog index
        run: python -m poller.catalog_index_main
