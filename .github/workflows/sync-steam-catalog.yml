name: Sync Steam Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "19 5 * * *"

permissions:
  contents: read

concurrency:
  group: catalog-database-sync
  cancel-in-progress: false

jobs:
  sync-steam:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CATALOG_SINK: supabase
      STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CATALOG_UPSERT_BATCH_SIZE: "1000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: poller/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r poller/requirements.txt

      - name: Verify secrets
        shell: bash
        run: |
          test -n "$STEAM_WEB_API_KEY" || (echo "Manca STEAM_WEB_API_KEY" && exit 1)
          test -n "$SUPABASE_URL" || (echo "Manca SUPABASE_URL" && exit 1)
          test -n "$SUPABASE_SECRET_KEY" || (echo "Manca SUPABASE_SECRET_KEY (o la legacy SUPABASE_SERVICE_ROLE_KEY)" && exit 1)

      - name: Sync Steam catalog to Supabase
        run: python -m poller.steam_catalog_main
