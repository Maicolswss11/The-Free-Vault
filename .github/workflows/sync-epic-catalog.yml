name: Sync Epic Catalog

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions usa UTC. Sincronizzazione quotidiana alle 04:41 UTC.
    - cron: "41 4 * * *"

permissions:
  contents: write

concurrency:
  group: epic-catalog-sync
  cancel-in-progress: false

jobs:
  sync-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: poller/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r poller/requirements.txt

      - name: Sync Epic catalog
        run: python -m poller.catalog_main

      - name: Commit catalog
        shell: bash
        run: |
          git add docs/catalog.json

          if git diff --cached --quiet; then
            echo "Catalogo invariato."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync Epic catalog"
          git pull --rebase origin main
          git push origin main
